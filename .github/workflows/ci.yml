name: Native build and regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.event.repository.private == false
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify shared core pin
        run: shasum -a 256 -c SHARED-CORE.sha256
      - name: Test and build
        run: |
          ./scripts/test.sh
          ./.build-tools/go/bin/go -C Engine test -p 2 ./...
          ./scripts/build.sh
          codesign --verify --deep --strict 'build/Paperwork Replica.app'
